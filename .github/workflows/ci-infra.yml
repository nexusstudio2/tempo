name: Infrastructure CI
on:
  push:
    branches: [main, Angel]
    paths:
      - "infrastructure/**"
      - ".env.example"
      - ".github/workflows/ci-infra.yml"
      - ".env.example"
      - ".github/workflows/ci-infra.yml"
  pull_request:
    branches: [main]
    paths:
      - "infrastructure/**"
jobs:
  validate-compose:
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: tempo-ci-only-db-password
      DB_ROOT_PASSWORD: tempo-ci-only-root-password
    steps:
      - uses: actions/checkout@v4
      - name: Validar configuración de Docker Compose
        run: docker compose --env-file .env.example -f infrastructure/docker/docker-compose.local.yml config --quiet
