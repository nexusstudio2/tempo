<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6A4DFF">
<title>Tempo | Panel del negocio</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F6FB;--sf:#fff;--ink:#101216;--mu:#5E6270;--ln:#E2E3EC;--br:#6A4DFF;--bs:#EFEAFF;--ok:#177A4B;--oks:#E1F5EA;--wa:#8A5A00;--was:#FFF1D6;--er:#C62F3E;--ers:#FDE6E8;--lg:#101216;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#101216;--sf:#181B21;--ink:#F4F5FA;--mu:#9EA3B3;--ln:#2A2E38;--br:#7357FF;--bs:#271F52;--ok:#4CD08B;--oks:#13301F;--wa:#F2B84B;--was:#3A2C0C;--er:#FF7A86;--ers:#3B1A1F;--lg:#F4F5FA}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#101216;--sf:#181B21;--ink:#F4F5FA;--mu:#9EA3B3;--ln:#2A2E38;--br:#7357FF;--bs:#271F52;--ok:#4CD08B;--oks:#13301F;--wa:#F2B84B;--was:#3A2C0C;--er:#FF7A86;--ers:#3B1A1F;--lg:#F4F5FA}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--br);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:10px;padding:10px 16px}
.lg{color:var(--lg)}.lg svg{width:34px;height:34px;display:block}
.ctx{display:flex;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:6px 10px;min-height:44px;font-size:13px;line-height:1.2;text-align:left;margin-left:auto;min-width:0}
.ctx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ctx .r{color:var(--mu)}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);font-size:18px;flex:none}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
nav button{flex:none;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--ln);background:var(--sf);font-weight:500;color:var(--mu)}
nav button[aria-current=page]{background:var(--br);border-color:var(--br);color:#fff}
main{padding:8px 16px 40px;max-width:1100px;margin:0 auto}
h1{font:600 26px/1.2 Outfit,sans-serif;margin:12px 0 4px;letter-spacing:-.3px}
.sub{color:var(--mu);margin:0 0 14px}
.br{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.br select{min-height:44px;border-radius:12px;border:1.5px solid var(--ln);background:var(--sf);color:var(--ink);padding:0 12px;font:inherit}
.alert{display:flex;gap:10px;align-items:center;background:var(--was);color:var(--wa);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-weight:500}
.alert button{margin-left:auto;background:none;border:0;font-weight:600;color:inherit;min-height:44px;text-decoration:underline}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.kpi{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px}
.kpi small{color:var(--mu)}.kpi strong{display:block;font:600 26px Outfit,sans-serif}
.kpi em{font-style:normal;font-size:13px;color:var(--ok)}.kpi em.d{color:var(--er)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:14px}
.card h2{font:600 18px Outfit,sans-serif;margin:0 0 12px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.qa button{min-height:56px;border-radius:14px;border:0;background:var(--br);color:#fff;font-weight:600}
.qa button.s{background:var(--sf);color:var(--ink);border:1.5px solid var(--ln)}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;margin-bottom:26px}
.bars div{flex:1;background:var(--bs);border-radius:8px 8px 4px 4px;position:relative}.bars div.l{background:var(--br)}
.bars span{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-size:12px;color:var(--mu)}
.tools{display:flex;gap:8px;margin-bottom:12px}
.tools input{flex:1;min-width:0;min-height:48px;border-radius:12px;border:1.5px solid var(--ln);background:var(--sf);color:var(--ink);padding:0 14px;font:inherit}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:0;background:var(--br);color:#fff;font-weight:600}
.btn.s{background:var(--sf);color:var(--ink);border:1.5px solid var(--ln)}.btn.d{background:var(--ers);color:var(--er)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.chips button{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--ln);background:var(--sf);font-size:14px}
.chips button[aria-pressed=true]{background:var(--bs);border-color:var(--br);color:var(--br);font-weight:600}
.list{display:grid;gap:10px}
.row{display:flex;gap:12px;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px 14px;min-height:64px;text-align:left;width:100%}
.av{flex:none;width:42px;height:42px;border-radius:12px;background:var(--bs);color:var(--br);display:grid;place-items:center;font:600 16px Outfit,sans-serif}
.row .t{flex:1;min-width:0}.row b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row small{color:var(--mu)}
.pill{flex:none;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.p-ok{background:var(--oks);color:var(--ok)}.p-wa{background:var(--was);color:var(--wa)}.p-er{background:var(--ers);color:var(--er)}.p-n{background:var(--bs);color:var(--br)}
.amt{flex:none;font-weight:600}
.cap{height:8px;background:var(--bs);border-radius:99px;margin-top:6px;overflow:hidden}.cap i{display:block;height:100%;background:var(--br)}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln);min-height:56px}
.set small{display:block;color:var(--mu)}
.sw{flex:none;width:52px;height:32px;border-radius:99px;border:0;background:var(--ln);position:relative}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked=true]{background:var(--br)}.sw[aria-checked=true]::after{left:24px}
.note{background:var(--bs);border-radius:14px;padding:12px 14px;font-size:14px}
.sheet{position:fixed;inset:0;background:rgba(10,10,20,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.on{display:flex}
.in{background:var(--sf);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.in h2{font:600 22px Outfit,sans-serif;margin:0 0 4px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln)}.kv span{color:var(--mu)}
.acts{display:grid;gap:8px;margin-top:16px}
.fld{margin-bottom:14px}.fld label{display:block;font-weight:500;font-size:14px;margin-bottom:6px}
.fld input,.fld select{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--ln);background:var(--bg);color:var(--ink);padding:0 14px;font:inherit}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;display:none;z-index:30;max-width:90%}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}.two{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}.sheet{align-items:center}.in{border-radius:22px}.qa{grid-template-columns:repeat(4,1fr)}}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
nav#nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);gap:0;overflow:visible;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));background:var(--sf);border-top:1px solid var(--ln);z-index:6}
nav#nav button{border:0;border-radius:12px;background:none;min-height:56px;padding:0 2px;font-size:12px;font-weight:500;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav#nav button span{font-size:20px;line-height:1}
nav#nav button[aria-current=page]{background:none;color:var(--br);font-weight:600}
.toast{bottom:calc(90px + env(safe-area-inset-bottom,0px))}
h1{letter-spacing:-.4px}
.btn{border-radius:14px;min-height:52px}
.tools input,.fld input,.fld select{border-radius:14px;min-height:52px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="mk" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="36" cy="38" r="19"/><path d="M31 11h10M36 11v6M51 20l4-4M54 14l4 4M3 31h9M1 38h11M5 45h8"/></g><path d="M28 38l6 6 10-11" fill="none" stroke="#6A4DFF" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/></symbol></svg>
<header>
  <div class="lg" role="img" aria-label="Tempo" style="display:flex;align-items:center;gap:6px"><svg><use href="#mk"/></svg><span aria-hidden="true" style="font:600 22px Outfit,sans-serif">tempo</span></div>
  <button class="ctx" id="ctx" aria-label="Cambiar de contexto"><span class="av" style="width:30px;height:30px;font-size:13px;border-radius:8px">GT</span><span style="min-width:0"><b>Gimnasio Titan</b><span class="r">Propietario</span></span></button>
  <button class="ib" id="tg" aria-label="Cambiar tema">◐</button>
</header>
<nav id="nav" aria-label="Secciones"></nav>
<main id="main"></main>
<div class="sheet" id="sh" role="dialog" aria-modal="true"><div class="in" id="shin"></div></div>
<div class="toast" id="to" role="status"></div>

<script>
var $=function(s){return document.querySelector(s)};
var TABS=[["ini","Inicio"],["cli","Clientes"],["mem","Membresías"],["pag","Pagos"],["asi","Asistencia"],["acc","Accesos"],["res","Reservas"],["equ","Equipo"],["suc","Sucursales"],["anu","Anuncios"],["cam","Campos"],["rep","Reportes"],["cfg","Ajustes"]];
var CLI=[["Ana Torres","Mensual Pro","ok","Activa","Vence 18 nov","Centro"],["Luis Herrera","Mensual","wa","Por vencer","Vence 06 nov","Centro"],["Marcela Ortiz","Paquete 10 clases","ok","Activa","7 créditos","Polanco"],["Diego Salas","Mensual","er","Vencida","Venció 25 oct","Centro"],["Paola Mena","Trimestral","ok","Activa","Vence 20 ene","Sur"],["Rafael Cruz","Mensual","n","Pendiente","Pago por confirmar","Polanco"]];
var MEM=[["Mensual","$650","Acceso ilimitado","412 activas"],["Mensual Pro","$890","Acceso + clases grupales","388 activas"],["Trimestral","$1,700","Acceso ilimitado","190 activas"],["Paquete 10 clases","$600","10 créditos · vigencia 60 días","96 activas"]];
var PAG=[["Ana Torres","Mensual Pro","$890","ok","Aprobado","Tarjeta · hoy 09:12"],["Rafael Cruz","Mensual","$650","wa","Pendiente","Transferencia · hoy 08:40"],["Paola Mena","Trimestral","$1,700","ok","Aprobado","Efectivo · ayer"],["Luis Herrera","Mensual","$650","er","Rechazado","Tarjeta · ayer"],["Marcela Ortiz","Paquete 10 clases","$600","n","Reembolso parcial","Tarjeta · 30 oct"]];
var ASI=[["Ana Torres","07:02","Centro","ok","QR"],["Diego Salas","07:15","Centro","er","Membresía vencida"],["Paola Mena","07:40","Sur","ok","QR"],["Marcela Ortiz","08:05","Polanco","ok","Manual"]];
var RES=[["Spinning 7:00","Centro","Coach Iván","18/20","ok"],["Funcional 8:00","Polanco","Coach Sara","20/20 · 3 en espera","wa"],["Yoga 19:00","Sur","Coach Mía","9/15","ok"]];
var EQU=[["Iván Rojas","Instructor","Centro"],["Sara Lugo","Instructor","Polanco"],["Karla Díaz","Recepción","Centro"],["Omar Vela","Gerente","Todas"]];
var SUC=[["Centro","Av. Juárez 120","520 clientes",84],["Polanco","Horacio 410","410 clientes",62],["Sur","Insurgentes 3000","310 clientes",45]];
var cur="ini",F="Todos",CF="Todos";
var DEV=[["Lector de QR","Cámara de recepción","▣","ok","En línea","Hace 2 min","Cámara del dispositivo",1,"Centro"],["Lector de huellas","ZKTeco · Puerta principal","☝","ok","En línea","Hace 5 min","Red local · 192.168.1.40",1,"Centro"],["Reconocimiento facial","Hikvision · Torniquete","☺","er","Sin conexión","Desde las 06:40","Red local · 192.168.1.52",1,"Centro"],["Lector de tarjetas","RFID · Vestidores","▭","wa","Sin probar","Nunca","USB",0,"Polanco"],["Lector de huellas","ZKTeco · Entrada","☝","ok","En línea","Hace 1 min","Red local · 192.168.2.31",1,"Sur"]];
function pill(c,t){return '<span class="pill p-'+c+'">'+t+'</span>'}
function ini(n){return n.split(' ').slice(0,2).map(function(x){return x[0]}).join('')}
function row(av,t,s,r,k,i){return '<button class="row" data-k="'+k+'" data-i="'+i+'"><span class="av">'+av+'</span><span class="t"><b>'+t+'</b><small>'+s+'</small></span>'+r+'</button>'}
function head(t,s){return '<h1>'+t+'</h1><p class="sub">'+s+'</p>'}
function brsel(){return '<div class="br"><label for="bs" style="font-weight:500">Sucursal</label><select id="bs"><option>Todas</option><option>Centro</option><option>Polanco</option><option>Sur</option></select></div>'}
function cliList(){var q=($('#q')||{value:""}).value.toLowerCase();var f=CLI.filter(function(x){return (CF==="Todos"||x[3]===CF)&&x[0].toLowerCase().indexOf(q)>-1});return f.length?f.map(function(x){return row(ini(x[0]),x[0],x[1]+" · "+x[4],pill(x[2],x[3]),"cli",CLI.indexOf(x))}).join(''):'<p class="sub">Sin resultados. Cambia el filtro o registra un cliente nuevo.</p>'}
var V={
ini:function(){return head("Hola, Carlos","Gimnasio Titan · hoy es 5 de noviembre")+brsel()+
'<div class="alert">⚠ 14 membresías vencen esta semana<button data-t="cli">Ver</button></div>'+'<div class="alert">⚠ 1 dispositivo de acceso sin conexión<button data-t="acc">Ver</button></div>'+
'<div class="qa"><button data-sheet="newc">Registrar cliente</button><button class="s" data-sheet="newp">Registrar pago</button><button class="s" data-t="asi">Ver asistencia</button><button class="s" data-t="rep">Reportes</button></div>'+
'<div class="kpis"><div class="kpi"><small>Clientes activos</small><strong>1,240</strong><em>+36 este mes</em></div><div class="kpi"><small>Ingresos del mes</small><strong>$284,500</strong><em>+6%</em></div><div class="kpi"><small>Asistencias hoy</small><strong>312</strong><em>pico 18:00</em></div><div class="kpi"><small>Pagos pendientes</small><strong>$12,300</strong><em class="d">9 clientes</em></div></div>'+
'<div class="two"><div class="card"><h2>Asistencia de la semana</h2><div class="bars"><div style="height:70%"><span>L</span></div><div style="height:82%"><span>M</span></div><div style="height:76%"><span>X</span></div><div style="height:88%"><span>J</span></div><div style="height:60%"><span>V</span></div><div style="height:35%"><span>S</span></div><div class="l" style="height:78%"><span>Hoy</span></div></div></div>'+
'<div class="card"><h2>Clases de hoy</h2><div class="list">'+RES.map(function(x,i){return row(x[0].split(' ')[1].replace(':00',''),x[0],x[1]+" · "+x[2],pill(x[4],x[3]),"res",i)}).join('')+'</div></div></div>'},
cli:function(){return head("Clientes","1,240 activos · 86 inactivos")+'<div class="tools"><input id="q" type="search" placeholder="Buscar por nombre" aria-label="Buscar cliente"><button class="btn" data-sheet="newc">Nuevo</button></div><div class="chips">'+["Todos","Activa","Por vencer","Vencida","Pendiente"].map(function(c){return '<button data-cf="'+c+'" aria-pressed="'+(c===CF)+'">'+c+'</button>'}).join('')+'</div><div class="list" id="cl">'+cliList()+'</div>'},
mem:function(){return head("Membresías y planes","Lo que ofrece tu negocio")+'<div class="list">'+MEM.map(function(m,i){return row(m[1].replace('$',''),m[0],m[2],'<span class="amt">'+m[3]+'</span>',"mem",i)}).join('')+'</div><button class="btn" style="width:100%;margin-top:12px" data-toast="Nuevo plan de membresía">Crear plan</button>'},
pag:function(){return head("Pagos","Cobros a tus clientes")+brsel()+'<div class="kpis"><div class="kpi"><small>Cobrado en noviembre</small><strong>$284,500</strong></div><div class="kpi"><small>Por cobrar</small><strong>$12,300</strong></div></div><div class="tools"><button class="btn" style="flex:1" data-sheet="newp">Registrar pago</button><button class="btn s" data-toast="Exportando pagos autorizados…">Exportar</button></div><div class="list">'+PAG.map(function(p,i){return row(ini(p[0]),p[0],p[1]+" · "+p[5],'<span class="amt">'+p[2]+'</span>'+pill(p[3],p[4]),"pag",i)}).join('')+'</div>'},
asi:function(){return head("Asistencia","Entradas de hoy")+brsel()+'<div class="qa"><button data-toast="Abriendo escáner de QR">Escanear QR</button><button class="s" data-toast="Registro manual autorizado">Registro manual</button></div><div class="list">'+ASI.map(function(a,i){return row(ini(a[0]),a[0],a[1]+" · "+a[2]+" · "+a[4],pill(a[3],a[3]==="ok"?"Entró":"Rechazada"),"asi",i)}).join('')+'</div>'},
res:function(){return head("Reservas y clases","Cupos de hoy")+brsel()+'<div class="list">'+RES.map(function(x,i){return row(x[0].split(' ')[1].replace(':00',''),x[0],x[1]+" · "+x[2],pill(x[4],x[3]),"res",i)}).join('')+'</div><button class="btn" style="width:100%;margin-top:12px" data-toast="Nueva clase">Crear clase</button>'},
equ:function(){return head("Equipo","Empleados e instructores")+'<div class="tools"><button class="btn" style="flex:1" data-sheet="inv">Invitar a alguien</button></div><div class="list">'+EQU.map(function(e,i){return row(ini(e[0]),e[0],e[1]+" · "+e[2],"","equ",i)}).join('')+'</div>'},
