<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6A4DFF">
<title>Tempo | Superadministrador</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F6FB;--sf:#fff;--ink:#101216;--mu:#5E6270;--ln:#E2E3EC;--br:#6A4DFF;--bs:#EFEAFF;--ok:#177A4B;--oks:#E1F5EA;--wa:#8A5A00;--was:#FFF1D6;--er:#C62F3E;--ers:#FDE6E8;--lg:#101216;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#101216;--sf:#181B21;--ink:#F4F5FA;--mu:#9EA3B3;--ln:#2A2E38;--br:#7357FF;--bs:#271F52;--ok:#4CD08B;--oks:#13301F;--wa:#F2B84B;--was:#3A2C0C;--er:#FF7A86;--ers:#3B1A1F;--lg:#F4F5FA}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#101216;--sf:#181B21;--ink:#F4F5FA;--mu:#9EA3B3;--ln:#2A2E38;--br:#7357FF;--bs:#271F52;--ok:#4CD08B;--oks:#13301F;--wa:#F2B84B;--was:#3A2C0C;--er:#FF7A86;--ers:#3B1A1F;--lg:#F4F5FA}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--br);outline-offset:2px}
.app{min-height:100vh}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:10px;padding:10px 16px}
.lg{display:flex;align-items:center;gap:6px;color:var(--lg);font:600 22px Outfit,sans-serif}
.lg svg{width:30px;height:30px}
.ctx{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:6px 10px;min-height:44px;font-size:13px;line-height:1.2;text-align:left}
.ctx b{display:block;font-weight:600}.ctx span{color:var(--mu)}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);font-size:18px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--bg);scrollbar-width:none}
nav button{flex:none;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--ln);background:var(--sf);font-weight:500;color:var(--mu)}
nav button[aria-current=page]{background:var(--br);border-color:var(--br);color:#fff}
main{padding:8px 16px 40px;max-width:1100px;margin:0 auto}
h1{font:600 26px/1.2 Outfit,sans-serif;margin:12px 0 4px;letter-spacing:-.3px}
.sub{color:var(--mu);margin:0 0 16px}
.alert{display:flex;gap:10px;align-items:center;background:var(--was);color:var(--wa);border-radius:14px;padding:12px 14px;margin-bottom:16px;font-weight:500}
.alert button{margin-left:auto;background:none;border:0;font-weight:600;color:inherit;min-height:44px;text-decoration:underline}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.kpi{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px}
.kpi small{color:var(--mu)}.kpi strong{display:block;font:600 26px Outfit,sans-serif;margin-top:2px}
.kpi em{font-style:normal;font-size:13px;color:var(--ok)}.kpi em.d{color:var(--er)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:14px}
.card h2{font:600 18px Outfit,sans-serif;margin:0 0 12px}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px}
.bars div{flex:1;background:var(--bs);border-radius:8px 8px 4px 4px;position:relative}
.bars div.l{background:var(--br)}
.bars div span{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-size:12px;color:var(--mu)}
.tools{display:flex;gap:8px;margin-bottom:12px}
.tools input,.tools select{flex:1;min-height:48px;border-radius:12px;border:1.5px solid var(--ln);background:var(--sf);color:var(--ink);padding:0 14px;font:inherit}
.tools select{flex:none;width:auto}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:0;background:var(--br);color:#fff;font-weight:600}
.btn.s{background:var(--sf);color:var(--ink);border:1.5px solid var(--ln)}
.list{display:grid;gap:10px}
.row{display:flex;gap:12px;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px 14px;min-height:64px;text-align:left;width:100%}
.av{flex:none;width:42px;height:42px;border-radius:12px;background:var(--bs);color:var(--br);display:grid;place-items:center;font:600 16px Outfit,sans-serif}
.row .t{flex:1;min-width:0}.row b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{color:var(--mu)}
.pill{flex:none;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.p-ok{background:var(--oks);color:var(--ok)}.p-wa{background:var(--was);color:var(--wa)}.p-er{background:var(--ers);color:var(--er)}.p-n{background:var(--bs);color:var(--br)}
.plans{display:grid;gap:12px}
.plan h3{font:600 20px Outfit,sans-serif;margin:0}
.plan .pr{font:600 28px Outfit,sans-serif;margin:6px 0}.plan .pr small{font:400 14px Inter;color:var(--mu)}
.plan ul{margin:8px 0 14px;padding:0;list-style:none;color:var(--mu);font-size:14px}
.plan li{padding:3px 0}
.sheet{position:fixed;inset:0;background:rgba(10,10,20,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.on{display:flex}
.sheet .in{background:var(--sf);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.sheet h2{font:600 22px Outfit,sans-serif;margin:0 0 4px}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--ln)}
.kv span{color:var(--mu)}
.acts{display:grid;gap:8px;margin-top:16px}
.btn.d{background:var(--ers);color:var(--er)}
.tl{border-left:2px solid var(--ln);margin:0 0 0 6px;padding:0 0 0 14px}
.tl div{position:relative;padding:0 0 14px}
.tl div::before{content:"";position:absolute;left:-20px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--br)}
.tl small{color:var(--mu);display:block}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;display:none;z-index:30}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}.plans{grid-template-columns:repeat(3,1fr)}.two{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}.sheet{align-items:center}.sheet .in{border-radius:22px}}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);gap:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));background:var(--sf);border-top:1px solid var(--ln);z-index:6;overflow:visible}nav button{min-height:56px;padding:0;border:0;border-radius:12px;background:none;color:var(--mu);font-size:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}nav button span{font-size:20px;line-height:1}nav button[aria-current=page]{background:none;color:var(--br);font-weight:600}.toast{bottom:calc(90px + env(safe-area-inset-bottom,0px))}
h1{letter-spacing:-.4px}
.btn{border-radius:14px;min-height:52px}
.tools input,.tools select{border-radius:14px;min-height:52px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="mk" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="36" cy="38" r="19"/><path d="M31 11h10M36 11v6M51 20l4-4M54 14l4 4M3 31h9M1 38h11M5 45h8"/></g><path d="M28 38l6 6 10-11" fill="none" stroke="#6A4DFF" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/></symbol></svg>
<div class="app">
<header>
  <div class="lg"><svg><use href="#mk"/></svg>tempo</div>
  <button class="ctx" id="ctx" aria-label="Cambiar de contexto"><span class="av" style="width:30px;height:30px;font-size:13px;border-radius:8px">L</span><span><b>Libiter</b><span>Superadmin · MFA activo</span></span></button>
  <button class="ib" id="tg" aria-label="Cambiar tema">◐</button>
</header>
<nav id="nav" aria-label="Secciones"></nav>
<main id="main"></main>
</div>
<div class="sheet" id="sh" role="dialog" aria-modal="true"><div class="in" id="shin"></div></div>
<div class="toast" id="to" role="status"></div>

<script>
var $=function(s){return document.querySelector(s)};
var TABS=[["res","Resumen"],["est","Establecimientos"],["pla","Planes"],["sus","Suscripciones"],["imp","Implementaciones"],["sop","Soporte"],["aud","Auditoría"]];
var EST=[["Gimnasio Titan","Gimnasio","Pro","ok","Activa","CDMX · 3 sucursales","1,240","$1,490"],["Academia Dance","Baile","Básico","ok","Activa","Guadalajara · 1 sucursal","310","$590"],["Flow Yoga Studio","Yoga y Pilates","Básico","wa","Pago rechazado","Monterrey · 1 sucursal","95","$590"],["Dojo Kaizen","Artes marciales","Pro","ok","Activa","Puebla · 2 sucursales","420","$1,490"],["Aqua Kids","Natación","Básico","n","En prueba","Querétaro · 1 sucursal","60","$0"],["Box Central","Boxeo","Pro","er","Suspendida","CDMX · 1 sucursal","180","$1,490"]];
var PLA=[["Básico","$590","1 sucursal · 300 clientes · 5 empleados · 2 dispositivos","Soporte por correo","Reservas y QR"],["Pro","$1,490","5 sucursales · 2,000 clientes · 25 empleados · 6 dispositivos","Soporte prioritario","Todos los módulos"],["Anual Pro","$14,900","5 sucursales · 2,000 clientes · 25 empleados · 6 dispositivos","Soporte prioritario","2 meses gratis"]];
var SUS=[["Gimnasio Titan","Pro mensual","Renueva 15 nov","ok","Activa"],["Academia Dance","Básico mensual","Renueva 02 dic","ok","Activa"],["Flow Yoga Studio","Básico mensual","Venció 28 oct · gracia 3 días","wa","En gracia"],["Aqua Kids","Prueba 14 días","Termina 09 nov","n","Prueba"],["Box Central","Pro mensual","Venció 12 oct","er","Suspendida"]];
var IMP=[["Dojo Kaizen","Migración de 420 clientes","Capacitación 06 nov","wa","En curso"],["Aqua Kids","Alta y 1 sucursal","Puesta en marcha 09 nov","n","Pendiente"],["Gimnasio Titan","Alta y 3 sucursales","Entregada 20 oct","ok","Completada"]];
var SOP=[["#214","Flow Yoga Studio","No llega el recordatorio de clase","er","Alta"],["#213","Gimnasio Titan","Duda sobre exportar clientes","n","Normal"],["#211","Academia Dance","Cambiar logo del portal","ok","Resuelto"]];
var AUD=[["Nadia R.","Cambió el precio del plan Pro","Hoy 10:42"],["Nadia R.","Suspendió a Box Central","Ayer 17:05"],["Sistema","Pago rechazado de Flow Yoga Studio","28 oct 09:00"],["Mario L.","Creó la promoción de lanzamiento","27 oct 12:30"],["Nadia R.","Inició sesión con MFA","27 oct 08:55"]];
var cur="res";
function pill(c,t){return '<span class="pill p-'+c+'">'+t+'</span>'}
function ini(n){return n.split(' ').slice(0,2).map(function(x){return x[0]}).join('')}
function rows(a,fn){return '<div class="list">'+a.map(fn).join('')+'</div>'}
function row(av,t,s,c,p,i,k){return '<button class="row" data-k="'+k+'" data-i="'+i+'"><span class="av">'+av+'</span><span class="t"><b>'+t+'</b><small>'+s+'</small></span>'+pill(c,p)+'</button>'}
function head(t,s){return '<h1>'+t+'</h1><p class="sub">'+s+'</p>'}
var V={
res:function(){return head("Resumen global","Estado de Tempo hoy, 5 de noviembre")+
'<div class="alert">⚠ 2 cuentas con pago pendiente<button data-t="sus">Revisar</button></div>'+
'<div class="kpis"><div class="kpi"><small>Establecimientos</small><strong>24</strong><em>+3 este mes</em></div><div class="kpi"><small>Ingreso mensual</small><strong>$31,860</strong><em>+8%</em></div><div class="kpi"><small>Suscripciones activas</small><strong>19</strong><em class="d">2 en riesgo</em></div><div class="kpi"><small>Incidencias abiertas</small><strong>4</strong><em>1 prioritaria</em></div></div>'+
'<div class="two"><div class="card"><h2>Ingresos de Libiter</h2><div class="bars" style="margin-bottom:26px"><div style="height:40%"><span>Jun</span></div><div style="height:52%"><span>Jul</span></div><div style="height:60%"><span>Ago</span></div><div style="height:72%"><span>Sep</span></div><div style="height:86%"><span>Oct</span></div><div class="l" style="height:100%"><span>Nov</span></div></div></div>'+
'<div class="card"><h2>Pendientes</h2>'+rows(IMP.slice(0,2),function(x,i){return row(ini(x[0]),x[0],x[1],x[3],x[4],i,"imp")})+'</div></div>'},
est:function(){return head("Establecimientos","24 negocios en la plataforma")+'<div class="tools"><input id="q" type="search" placeholder="Buscar establecimiento" aria-label="Buscar"><button class="btn" data-toast="Alta de establecimiento">Nuevo</button></div><div id="el">'+rows(EST,function(x,i){return row(ini(x[0]),x[0],x[1]+" · "+x[2],x[3],x[4],i,"est")})+'</div>'},
pla:function(){return head("Planes comerciales","Los cambios aplican sin nuevo despliegue")+'<div class="plans">'+PLA.map(function(p){return '<div class="card plan"><h3>'+p[0]+'</h3><div class="pr">'+p[1]+' <small>MXN</small></div><ul><li>'+p[2]+'</li><li>'+p[3]+'</li><li>'+p[4]+'</li></ul><button class="btn s" style="width:100%" data-toast="Editando plan '+p[0]+'">Editar plan</button></div>'}).join('')+'</div><button class="btn" style="width:100%;margin-top:4px" data-toast="Nuevo plan">Crear plan</button>'},
sus:function(){return head("Suscripciones","Cobros de Libiter a establecimientos")+rows(SUS,function(x,i){return row(ini(x[0]),x[0],x[1]+" · "+x[2],x[3],x[4],i,"sus")})},
imp:function(){return head("Implementaciones","Altas, migraciones y capacitación")+rows(IMP,function(x,i){return row(ini(x[0]),x[0],x[1]+" · "+x[2],x[3],x[4],i,"imp")})},
sop:function(){return head("Soporte","Incidencias de establecimientos")+rows(SOP,function(x,i){return row(x[0],x[1],x[2],x[3],x[4],i,"sop")})},
aud:function(){return head("Auditoría","Acciones administrativas sensibles")+'<div class="card"><div class="tl">'+AUD.map(function(a){return '<div><b>'+a[1]+'</b><small>'+a[0]+' · '+a[2]+'</small></div>'}).join('')+'</div></div>'}
};
function render(){
 $('#nav').innerHTML=TABS.map(function(t){return '<button data-t="'+t[0]+'"'+(t[0]===cur?' aria-current="page"':'')+'>'+t[1]+'</button>'}).join('');
 $('#main').innerHTML=V[cur]();
 var q=$('#q');if(q)q.addEventListener('input',function(){var v=q.value.toLowerCase();var f=EST.filter(function(x){return x[0].toLowerCase().indexOf(v)>-1});$('#el').innerHTML=f.length?rows(f,function(x){return row(ini(x[0]),x[0],x[1]+" · "+x[2],x[3],x[4],EST.indexOf(x),"est")}):'<p class="sub">Sin resultados. Prueba con otro nombre.</p>'});
}
function toast(t){var e=$('#to');e.textContent=t;e.style.display='block';setTimeout(function(){e.style.display='none'},2200)}
function open(h){$('#shin').innerHTML=h;$('#sh').classList.add('on')}
function close(){$('#sh').classList.remove('on')}
function kv(a,b){return '<div class="kv"><span>'+a+'</span><b>'+b+'</b></div>'}
document.addEventListener('click',function(e){
 var t=e.target.closest('[data-t]');if(t){cur=t.dataset.t;render();window.scrollTo(0,0);return}
 var m=e.target.closest('[data-toast]');if(m){close();toast(m.dataset.toast);return}
 if(e.target.id==='sh'||e.target.closest('[data-x]')){close();return}
 var r=e.target.closest('[data-k]');if(!r)return;
 var k=r.dataset.k,i=+r.dataset.i;
 if(k==="est"){var x=EST[i];open('<h2>'+x[0]+'</h2><p class="sub">'+x[1]+' · '+x[5]+'</p>'+kv("Estado",pill(x[3],x[4]))+kv("Plan",x[2])+kv("Clientes",x[6])+kv("Mensualidad",x[7]+" MXN")+'<div class="acts"><button class="btn" data-toast="Entrando en modo soporte (auditado)">Ver como soporte</button><button class="btn s" data-toast="Cambio de plan">Cambiar plan</button><button class="btn d" data-toast="Se pedirá confirmación y quedará en auditoría">Suspender cuenta</button><button class="btn s" data-x>Cerrar</button></div>')}
 else if(k==="sus"){var s=SUS[i];open('<h2>'+s[0]+'</h2><p class="sub">'+s[1]+'</p>'+kv("Estado",pill(s[3],s[4]))+kv("Vigencia",s[2])+'<div class="acts"><button class="btn" data-toast="Recordatorio de pago enviado">Enviar recordatorio</button><button class="btn s" data-toast="Periodo de gracia ampliado">Ampliar gracia</button><button class="btn s" data-x>Cerrar</button></div>')}
 else if(k==="imp"){var n=IMP[i];open('<h2>'+n[0]+'</h2><p class="sub">'+n[1]+'</p>'+kv("Estado",pill(n[3],n[4]))+kv("Siguiente hito",n[2])+'<div class="acts"><button class="btn" data-toast="Hito marcado como completado">Marcar hito completado</button><button class="btn s" data-x>Cerrar</button></div>')}
 else if(k==="sop"){var o=SOP[i];open('<h2>Incidencia '+o[0]+'</h2><p class="sub">'+o[1]+'</p>'+kv("Asunto",o[2])+kv("Prioridad",pill(o[3],o[4]))+'<div class="acts"><button class="btn" data-toast="Respuesta enviada">Responder</button><button class="btn s" data-toast="Incidencia resuelta">Marcar como resuelta</button><button class="btn s" data-x>Cerrar</button></div>')}
});
$('#ctx').addEventListener('click',function(){open('<h2>Cambiar de espacio</h2><p class="sub">Sin cerrar sesión.</p><div class="list">'+[["L","Libiter","Superadministrador"],["GT","Gimnasio Titan","Propietario"],["AD","Academia Dance","Instructor"]].map(function(c){return '<button class="row" data-toast="Cambiando a '+c[1]+'…"><span class="av">'+c[0]+'</span><span class="t"><b>'+c[1]+'</b><small>'+c[2]+'</small></span></button>'}).join('')+'</div>')});
$('#tg').addEventListener('click',function(){var r=document.documentElement,d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'});
document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
(function(){
var MAIN=[["res","Resumen","⌂"],["est","Negocios","▦"],["pla","Planes","◧"],["sop","Soporte","?"]];
TABS.push(["pgl","Pagos de Libiter"],["pro","Promociones"],["cfg","Configuración"]);
var _r=render;render=function(){_r();var inMain=MAIN.some(function(t){return t[0]===cur});$('#nav').innerHTML=MAIN.map(function(t){return '<button data-t="'+t[0]+'"'+(t[0]===cur?' aria-current="page"':'')+'><span aria-hidden="true">'+t[2]+'</span>'+t[1]+'</button>'}).join('')+'<button data-more'+(inMain?'':' aria-current="page"')+'><span aria-hidden="true">⋯</span>Más</button>'};
document.addEventListener('click',function(e){if(e.target.closest('[data-more]')){var ids=MAIN.map(function(t){return t[0]});open('<h2>Más secciones</h2><div class="list" style="margin-top:12px">'+TABS.filter(function(t){return ids.indexOf(t[0])<0}).map(function(t){return '<button class="row" data-t="'+t[0]+'"><span class="t"><b>'+t[1]+'</b></span><span style="color:var(--mu);font-size:20px">›</span></button>'}).join('')+'</div>')}else if(e.target.closest('#shin [data-t]'))close()});
var PGL=[["Gimnasio Titan","Pro mensual · $1,490","15 oct","ok","Aprobado"],["Academia Dance","Básico mensual · $590","02 nov","ok","Aprobado"],["Flow Yoga Studio","Básico mensual · $590","28 oct","er","Rechazado"],["Dojo Kaizen","Implementación · $4,500","20 oct","ok","Aprobado"]];
V.pgl=function(){return head("Pagos de Libiter","Lo que Libiter cobra a los establecimientos")+'<div class="kpis"><div class="kpi"><small>Cobrado en noviembre</small><strong>$31,860</strong></div><div class="kpi"><small>Rechazados</small><strong>2</strong></div></div><p class="sub">Estos fondos son independientes de los cobros de cada establecimiento a sus clientes.</p>'+rows(PGL,function(x,i){return row(ini(x[0]),x[0],x[1]+" · "+x[2],x[3],x[4],i,"pgl")})};
