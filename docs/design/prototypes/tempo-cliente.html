<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6A4DFF">
<title>Tempo | Mi portal</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F6FB;--sf:#fff;--ink:#101216;--mu:#5E6270;--ln:#E2E3EC;--br:#6A4DFF;--bs:#EFEAFF;--ok:#177A4B;--oks:#E1F5EA;--wa:#8A5A00;--was:#FFF1D6;--er:#C62F3E;--ers:#FDE6E8;--lg:#101216;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#101216;--sf:#181B21;--ink:#F4F5FA;--mu:#9EA3B3;--ln:#2A2E38;--br:#7357FF;--bs:#271F52;--ok:#4CD08B;--oks:#13301F;--wa:#F2B84B;--was:#3A2C0C;--er:#FF7A86;--ers:#3B1A1F;--lg:#F4F5FA}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#101216;--sf:#181B21;--ink:#F4F5FA;--mu:#9EA3B3;--ln:#2A2E38;--br:#7357FF;--bs:#271F52;--ok:#4CD08B;--oks:#13301F;--wa:#F2B84B;--was:#3A2C0C;--er:#FF7A86;--ers:#3B1A1F;--lg:#F4F5FA}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--br);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:10px;padding:10px 16px}
.lg{color:var(--lg)}.lg svg{width:34px;height:34px;display:block}
.ctx{display:flex;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:6px 10px;min-height:44px;font-size:13px;line-height:1.2;text-align:left;margin-left:auto;min-width:0}
.ctx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ctx .r{color:var(--mu)}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);font-size:18px;flex:none;position:relative}
.ib i{position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:9px;background:var(--er);color:#fff;font:600 11px/18px Inter;font-style:normal;text-align:center}
main{padding:8px 16px 24px;max-width:560px;margin:0 auto}
h1{font:600 26px/1.2 Outfit,sans-serif;margin:12px 0 4px;letter-spacing:-.3px}
h2{font:600 18px Outfit,sans-serif;margin:20px 0 10px}
.sub{color:var(--mu);margin:0 0 14px}
.mc{background:var(--br);color:#fff;border-radius:22px;padding:20px;margin:6px 0 14px}
.mc small{opacity:.85}.mc .t{font:600 28px Outfit,sans-serif;margin:2px 0 12px}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.3);overflow:hidden}.bar i{display:block;height:100%;background:#fff}
.mc p{margin:8px 0 0;font-size:14px;opacity:.95}
.pill{flex:none;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.p-ok{background:var(--oks);color:var(--ok)}.p-wa{background:var(--was);color:var(--wa)}.p-er{background:var(--ers);color:var(--er)}.p-n{background:var(--bs);color:var(--br)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.btn{min-height:52px;padding:0 18px;border-radius:14px;border:0;background:var(--br);color:#fff;font-weight:600}
.btn.s{background:var(--sf);color:var(--ink);border:1.5px solid var(--ln)}.btn.d{background:var(--ers);color:var(--er)}
.btn[disabled]{opacity:.5}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:16px;margin-bottom:12px}
.card h3{font:600 17px Outfit,sans-serif;margin:0 0 4px}
.streak{display:flex;align-items:center;gap:14px}
.streak .n{font:700 40px Outfit,sans-serif;color:var(--br);line-height:1}
.dots{display:flex;gap:6px;margin-top:8px}.dots span{width:26px;height:26px;border-radius:8px;background:var(--bs);display:grid;place-items:center;font-size:13px;color:var(--mu)}.dots span.on{background:var(--br);color:#fff}
.ann{background:var(--bs);border-radius:16px;padding:14px;margin-bottom:10px}.ann b{display:block}.ann small{color:var(--mu)}
.list{display:grid;gap:10px}
.row{display:flex;gap:12px;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px 14px;min-height:64px;text-align:left;width:100%}
.av{flex:none;width:42px;height:42px;border-radius:12px;background:var(--bs);color:var(--br);display:grid;place-items:center;font:600 14px Outfit,sans-serif;text-align:center;line-height:1.1}
.row .t{flex:1;min-width:0}.row b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row small{color:var(--mu)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sf);border:1.5px solid var(--ln);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{min-height:44px;border:0;border-radius:10px;background:none;font-weight:500;color:var(--mu)}
.seg button[aria-pressed=true]{background:var(--br);color:#fff}
.day{font:600 15px Outfit,sans-serif;color:var(--mu);margin:16px 0 8px}
.qrw{text-align:center;padding-top:8px}
.qrb{background:#fff;border-radius:24px;padding:18px;display:inline-block;border:1px solid var(--ln)}
.qrb svg{width:240px;height:240px;display:block}
.qrw .nm{font:600 22px Outfit,sans-serif;margin:14px 0 2px}
.cd{margin:10px auto 14px;max-width:260px}.cd .bar{background:var(--bs)}.cd .bar i{background:var(--br);transition:width 1s linear}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln);min-height:56px}.set small{display:block;color:var(--mu)}
.sw{flex:none;width:52px;height:32px;border-radius:99px;border:0;background:var(--ln);position:relative}.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}.sw[aria-checked=true]{background:var(--br)}.sw[aria-checked=true]::after{left:24px}
.tab{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
.tab button{background:none;border:0;min-height:56px;border-radius:12px;color:var(--mu);font-size:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tab button span{font-size:20px;line-height:1}.tab button[aria-current=page]{color:var(--br);font-weight:600}
.sheet{position:fixed;inset:0;background:rgba(10,10,20,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.on{display:flex}
.in{background:var(--sf);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.in h2{font-size:22px;margin:0 0 4px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln)}.kv span{color:var(--mu)}
.acts{display:grid;gap:8px;margin-top:16px}
.nt{padding:12px 0;border-bottom:1px solid var(--ln)}.nt small{color:var(--mu);display:block}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;display:none;z-index:30;max-width:90%}
h1{letter-spacing:-.4px}
.ctx b{max-width:120px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="mk" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="36" cy="38" r="19"/><path d="M31 11h10M36 11v6M51 20l4-4M54 14l4 4M3 31h9M1 38h11M5 45h8"/></g><path d="M28 38l6 6 10-11" fill="none" stroke="#6A4DFF" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/></symbol></svg>
<header>
  <div class="lg" role="img" aria-label="Tempo" style="display:flex;align-items:center;gap:6px"><svg><use href="#mk"/></svg><span aria-hidden="true" style="font:600 22px Outfit,sans-serif">tempo</span></div>
  <button class="ctx" id="ctx" aria-label="Cambiar de contexto"><span class="av" style="width:30px;height:30px;font-size:12px;border-radius:8px">GT</span><span style="min-width:0"><b>Gimnasio Titan</b><span class="r">Cliente</span></span></button>
  <button class="ib" id="bell" aria-label="Notificaciones, 2 sin leer">🔔<i>2</i></button>
  <button class="ib" id="tg" aria-label="Cambiar tema">◐</button>
</header>
<main id="main"></main>
<div class="tab" id="tab" role="navigation" aria-label="Secciones"></div>
<div class="sheet" id="sh" role="dialog" aria-modal="true"><div class="in" id="shin"></div></div>
<div class="toast" id="to" role="status"></div>

<script>
var $=function(s){return document.querySelector(s)};
var TABS=[["ini","Inicio","⌂"],["res","Reservas","▦"],["qr","Mi QR","▣"],["pag","Pagos","$"],["per","Perfil","☺"]];
var CLS=[["Spinning","Hoy","18:00","Coach Iván",20,18,"none"],["Funcional","Hoy","19:00","Coach Sara",20,20,"none"],["Yoga","Mañana","07:30","Coach Mía",15,9,"none"],["Boxeo","Mañana","18:30","Coach Leo",16,12,"none"],["Spinning","Sábado","09:00","Coach Iván",20,14,"none"]];
CLS[2][6]="res";CLS[2][5]=10;
var PAG=[["Mensual Pro","$890","18 oct","Aprobado","ok","Tarjeta"],["Mensual Pro","$890","18 sep","Aprobado","ok","Tarjeta"],["Mensual Pro","$890","18 ago","Reembolsado","n","Tarjeta"],["Mensual Pro","$890","18 jul","Aprobado","ok","Efectivo"]];
var ASI=[["Hoy 07:02","Centro","QR"],["Ayer 18:10","Centro","QR"],["Lun 3 nov 07:00","Centro","QR"],["Vie 31 oct 19:05","Centro","Huella"]];
var NOT=[["Tu membresía vence el 18 de noviembre","Renueva con tiempo para no perder acceso","Hoy"],["Cambio de horario: Yoga de mañana","Ahora es a las 07:30","Ayer"],["Pago aprobado","Mensual Pro · $890","18 oct"]];
var ANN=[["Cerrado el 20 de noviembre","Por mantenimiento, abrimos el 21 a las 6:00."],["Nueva clase de boxeo","Martes y jueves 18:30. Ya puedes reservar."]];
var cur="ini",tab="dis",timer=null,left=60,tok=1;
function pill(c,t){return '<span class="pill p-'+c+'">'+t+'</span>'}
function head(t,s){return '<h1>'+t+'</h1><p class="sub">'+s+'</p>'}
function qrSvg(seed){var n=25,s=seed*9301+49297,r=function(){s=(s*9301+49297)%233280;return s/233280},o='';
 function fin(x,y){return '<rect x="'+x+'" y="'+y+'" width="7" height="7" fill="#101216"/><rect x="'+(x+1)+'" y="'+(y+1)+'" width="5" height="5" fill="#fff"/><rect x="'+(x+2)+'" y="'+(y+2)+'" width="3" height="3" fill="#101216"/>'}
 for(var y=0;y<n;y++)for(var x=0;x<n;x++){var inF=(x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9);if(!inF&&r()>.5)o+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="#101216"/>'}
 return '<svg viewBox="-1 -1 27 27" role="img" aria-label="Código QR personal, cambia cada minuto" shape-rendering="crispEdges">'+o+fin(0,0)+fin(n-7,0)+fin(0,n-7)+'</svg>'}
var V={
ini:function(){return head("Hola, Ana","Qué bueno verte hoy")+'<div class="row" style="margin:6px 0 12px;min-height:56px"><span class="av">GT</span><span class="t"><b>Gimnasio Titan</b><small>Sucursal Centro · abierto hasta las 22:00</small></span></div>'+
'<div class="mc"><small>Tu membresía</small><div class="t">Mensual Pro</div><div class="bar"><i style="width:55%"></i></div><p>Activa · vence el 18 de noviembre (13 días)</p></div>'+
'<div class="two"><button class="btn" data-t="qr">Mostrar mi QR</button><button class="btn s" data-t="res">Reservar clase</button></div>'+
'<h2>Próxima reserva</h2><div class="list">'+CLS.filter(function(c){return c[6]!=="none"}).map(function(c){return row(c)}).join('')+'</div>'+
'<h2>Tu racha</h2><div class="card"><div class="streak"><div class="n">7</div><div><h3>días seguidos</h3><small style="color:var(--mu)">Meta del mes: 9 de 12 visitas</small></div></div><div class="dots" aria-label="Últimos 7 días">'+[1,1,1,1,1,1,1].map(function(){return '<span class="on">✓</span>'}).join('')+'</div></div>'+
'<h2>Anuncios</h2>'+ANN.map(function(a){return '<div class="ann"><b>'+a[0]+'</b><small>'+a[1]+'</small></div>'}).join('')},
res:function(){var days=["Hoy","Mañana","Sábado"];return head("Reservas","Cancela hasta 2 horas antes sin penalización")+'<div class="seg" role="group"><button data-s="dis" aria-pressed="'+(tab==="dis")+'">Clases disponibles</button><button data-s="mis" aria-pressed="'+(tab==="mis")+'">Mis reservas</button></div>'+
 (tab==="dis"?days.map(function(d){return '<div class="day">'+d+'</div><div class="list">'+CLS.filter(function(c){return c[1]===d}).map(function(c){return row(c)}).join('')+'</div>'}).join(''):
 (CLS.some(function(c){return c[6]!=="none"})?'<div class="list">'+CLS.filter(function(c){return c[6]!=="none"}).map(function(c){return row(c)}).join('')+'</div>':'<p class="sub">Aún no tienes reservas. Elige una clase en Clases disponibles.</p>'))},
qr:function(){return '<div class="qrw"><h1>Mi código QR</h1><p class="sub">Muéstralo en recepción para entrar</p><div class="qrb" id="qrb">'+qrSvg(tok)+'</div><div class="nm">Ana Torres</div><small style="color:var(--mu)">Mensual Pro · activa</small><div class="cd"><div class="bar"><i id="cdb" style="width:'+(left/60*100)+'%"></i></div><small id="cdt" style="color:var(--mu)">Se renueva en '+left+' s</small></div><button class="btn s" style="width:100%" data-toast="Abriendo cámara para escanear el QR del establecimiento">Escanear QR del establecimiento</button><p class="sub" style="margin-top:12px">El código cambia cada minuto para que nadie pueda reutilizarlo.</p></div>'},
pag:function(){return head("Pagos","Tus cobros y comprobantes")+'<div class="card"><h3>Mensual Pro</h3><small style="color:var(--mu)">Próximo cobro: 18 de noviembre · $890 MXN</small><div class="acts"><button class="btn" data-toast="Renovación: el pago se confirma desde el servidor">Renovar membresía</button></div></div><h2>Historial</h2><div class="list">'+PAG.map(function(p,i){return '<button class="row" data-k="pag" data-i="'+i+'"><span class="av">'+p[2].replace(' ','<br>')+'</span><span class="t"><b>'+p[0]+'</b><small>'+p[5]+'</small></span><span style="font-weight:600">'+p[1]+'</span>'+pill(p[4],p[3])+'</button>'}).join('')+'</div>'},
per:function(){return head("Perfil","Ana Torres · ana.torres@correo.com")+'<div class="list"><button class="row" data-k="asi"><span class="av">✓</span><span class="t"><b>Historial de asistencia</b><small>24 visitas este año</small></span><span style="color:var(--mu);font-size:20px">›</span></button><button class="row" data-k="est"><span class="av">GT</span><span class="t"><b>Información del establecimiento</b><small>Horarios, sucursales y contacto</small></span><span style="color:var(--mu);font-size:20px">›</span></button></div><h2>Notificaciones</h2><div class="card" style="padding:4px 16px"><div class="set"><span>Recordatorios de clase<small>1 hora antes</small></span><button class="sw" role="switch" aria-checked="true" aria-label="Recordatorios de clase"></button></div><div class="set"><span>Avisos de vencimiento<small>3 días antes</small></span><button class="sw" role="switch" aria-checked="true" aria-label="Avisos de vencimiento"></button></div><div class="set" style="border:0"><span>Notificaciones push<small>En este dispositivo</small></span><button class="sw" role="switch" aria-checked="false" aria-label="Notificaciones push"></button></div></div><button class="btn s" style="width:100%;margin-top:6px" data-toast="Sesión cerrada">Cerrar sesión</button>'}
};
function row(c){var i=CLS.indexOf(c),st=c[6]==="res"?pill("ok","Reservada"):c[6]==="wait"?pill("wa","En espera"):c[5]>=c[4]?pill("wa","Lleno"):pill("n",(c[4]-c[5])+" lugares");
 return '<button class="row" data-k="cls" data-i="'+i+'"><span class="av">'+c[2].replace(':','<br>')+'</span><span class="t"><b>'+c[0]+'</b><small>'+c[1]+' · '+c[3]+'</small></span>'+st+'</button>'}
function render(){
 clearInterval(timer);
 $('#tab').innerHTML=TABS.map(function(t){return '<button data-t="'+t[0]+'"'+(t[0]===cur?' aria-current="page"':'')+'><span aria-hidden="true">'+t[2]+'</span>'+t[1]+'</button>'}).join('');
 $('#main').innerHTML=V[cur]();
 if(cur==="qr"){timer=setInterval(function(){left--;if(left<=0){left=60;tok++;$('#qrb').innerHTML=qrSvg(tok)}var b=$('#cdb'),t=$('#cdt');if(b){b.style.width=(left/60*100)+'%';t.textContent='Se renueva en '+left+' s'}},1000)}
}
function toast(t){var e=$('#to');e.textContent=t;e.style.display='block';setTimeout(function(){e.style.display='none'},2400)}
function open(h){$('#shin').innerHTML=h;$('#sh').classList.add('on')}
function close(){$('#sh').classList.remove('on')}
function kv(a,b){return '<div class="kv"><span>'+a+'</span><b>'+b+'</b></div>'}
var X='<button class="btn s" data-x>Cerrar</button>';
document.addEventListener('click',function(e){
 var t=e.target.closest('[data-t]');if(t){cur=t.dataset.t;render();window.scrollTo(0,0);return}
 var sg=e.target.closest('[data-s]');if(sg){tab=sg.dataset.s;render();return}
 var sw=e.target.closest('.sw');if(sw){sw.setAttribute('aria-checked',sw.getAttribute('aria-checked')!=='true');return}
 var rv=e.target.closest('[data-rv]');if(rv){var c=CLS[+rv.dataset.rv],a=rv.dataset.act;
  if(a==="go"){if(c[5]<c[4]){c[6]="res";c[5]++;toast("Reserva confirmada: "+c[0]+" "+c[1].toLowerCase()+" "+c[2])}else{c[6]="wait";toast("Lista de espera: te avisaremos si se libera un lugar")}}
  else{if(c[6]==="res")c[5]--;c[6]="none";toast("Reserva cancelada")}
  close();render();return}
 var m=e.target.closest('[data-toast]');if(m){close();toast(m.dataset.toast);return}
 if(e.target.id==='sh'||e.target.closest('[data-x]')){close();return}
 var r=e.target.closest('[data-k]');if(!r)return;var k=r.dataset.k,i=+r.dataset.i;
 if(k==="cls"){var c=CLS[i],full=c[5]>=c[4];open('<h2>'+c[0]+'</h2><p class="sub">'+c[1]+' · '+c[2]+' · '+c[3]+'</p>'+kv("Cupo",c[5]+" de "+c[4])+kv("Tu estado",c[6]==="res"?pill("ok","Reservada"):c[6]==="wait"?pill("wa","En espera"):"Sin reserva")+'<div class="acts">'+(c[6]==="none"?'<button class="btn" data-rv="'+i+'" data-act="go">'+(full?'Unirme a la lista de espera':'Reservar lugar')+'</button>':'<button class="btn d" data-rv="'+i+'" data-act="cancel">'+(c[6]==="res"?'Cancelar reserva':'Salir de la lista de espera')+'</button>')+X+'</div>')}
 else if(k==="pag"){var p=PAG[i];open('<h2>'+p[1]+' MXN</h2><p class="sub">'+p[0]+' · '+p[2]+'</p>'+kv("Estado",pill(p[4],p[3]))+kv("Método",p[5])+'<p class="sub" style="margin-top:12px">Es un comprobante interno de Tempo, no una factura fiscal (CFDI).</p><div class="acts"><button class="btn s" data-toast="Comprobante descargado">Descargar comprobante</button>'+X+'</div>')}
 else if(k==="asi"){open('<h2>Historial de asistencia</h2><p class="sub">Tus últimas entradas</p>'+ASI.map(function(a){return kv(a[0]+" · "+a[1],a[2])}).join('')+'<div class="acts">'+X+'</div>')}
 else if(k==="est"){open('<h2>Gimnasio Titan</h2><p class="sub">Tu establecimiento</p>'+kv("Centro","Av. Juárez 120")+kv("Polanco","Horacio 410")+kv("Sur","Insurgentes 3000")+kv("Horario","Lun a vie 6:00–22:00 · Sáb 8:00–14:00")+'<div class="acts">'+X+'</div>')}
});
