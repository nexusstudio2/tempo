<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6A4DFF">
<title>Tempo | Instructor</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F6FB;--sf:#fff;--ink:#101216;--mu:#5E6270;--ln:#E2E3EC;--br:#6A4DFF;--bs:#EFEAFF;--ok:#177A4B;--oks:#E1F5EA;--wa:#8A5A00;--was:#FFF1D6;--er:#C62F3E;--ers:#FDE6E8;--lg:#101216;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#101216;--sf:#181B21;--ink:#F4F5FA;--mu:#9EA3B3;--ln:#2A2E38;--br:#7357FF;--bs:#271F52;--ok:#4CD08B;--oks:#13301F;--wa:#F2B84B;--was:#3A2C0C;--er:#FF7A86;--ers:#3B1A1F;--lg:#F4F5FA}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#101216;--sf:#181B21;--ink:#F4F5FA;--mu:#9EA3B3;--ln:#2A2E38;--br:#7357FF;--bs:#271F52;--ok:#4CD08B;--oks:#13301F;--wa:#F2B84B;--was:#3A2C0C;--er:#FF7A86;--ers:#3B1A1F;--lg:#F4F5FA}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--br);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:10px;padding:10px 16px}
.lg{color:var(--lg)}.lg svg{width:34px;height:34px;display:block}
.ctx{display:flex;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:6px 10px;min-height:44px;font-size:13px;line-height:1.2;text-align:left;margin-left:auto;min-width:0}
.ctx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ctx .r{color:var(--mu)}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);font-size:18px;flex:none}
main{padding:8px 16px 24px;max-width:640px;margin:0 auto}
h1{font:600 26px/1.2 Outfit,sans-serif;margin:12px 0 4px;letter-spacing:-.3px}
h2{font:600 18px Outfit,sans-serif;margin:18px 0 10px}
.sub{color:var(--mu);margin:0 0 14px}
.next{background:var(--br);color:#fff;border-radius:22px;padding:20px;margin:6px 0 16px}
.next small{opacity:.85}.next .t{font:600 26px Outfit,sans-serif;line-height:1.15;margin:4px 0}
.next p{margin:0 0 14px;opacity:.95}
.next button{width:100%;min-height:54px;border:0;border-radius:14px;background:#fff;color:#101216;font-weight:600;font-size:16px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.kpi{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:10px 12px}
.kpi small{color:var(--mu);font-size:12px}.kpi strong{display:block;font:600 22px Outfit,sans-serif}
.btn{min-height:52px;padding:0 18px;border-radius:14px;border:0;background:var(--br);color:#fff;font-weight:600}
.btn.s{background:var(--sf);color:var(--ink);border:1.5px solid var(--ln)}
.list{display:grid;gap:10px}
.row{display:flex;gap:12px;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px 14px;min-height:64px;text-align:left;width:100%}
.av{flex:none;width:42px;height:42px;border-radius:12px;background:var(--bs);color:var(--br);display:grid;place-items:center;font:600 15px Outfit,sans-serif}
.row .t{flex:1;min-width:0}.row b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row small{color:var(--mu)}
.pill{flex:none;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.p-ok{background:var(--oks);color:var(--ok)}.p-wa{background:var(--was);color:var(--wa)}.p-er{background:var(--ers);color:var(--er)}.p-n{background:var(--bs);color:var(--br)}
.search{width:100%;min-height:52px;border-radius:14px;border:1.5px solid var(--ln);background:var(--sf);color:var(--ink);padding:0 16px;font:inherit;margin-bottom:12px}
.note{background:var(--bs);border-radius:14px;padding:12px 14px;font-size:14px;margin:0 0 14px}
.day{font:600 15px Outfit,sans-serif;color:var(--mu);margin:16px 0 8px}
.tab{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
.tab button{background:none;border:0;min-height:56px;border-radius:12px;color:var(--mu);font-size:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tab button span{font-size:20px;line-height:1}.tab button[aria-current=page]{color:var(--br);font-weight:600}
.sheet{position:fixed;inset:0;background:rgba(10,10,20,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.on{display:flex}
.in{background:var(--sf);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.in h2{font-size:22px;margin:0 0 4px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln)}.kv span{color:var(--mu)}
.acts{display:grid;gap:8px;margin-top:16px}
.fld{margin-bottom:14px}.fld label{display:block;font-weight:500;font-size:14px;margin-bottom:6px}
.fld textarea,.fld select{width:100%;border-radius:12px;border:1.5px solid var(--ln);background:var(--bg);color:var(--ink);padding:12px 14px;font:inherit}
.fld select{min-height:52px;padding:0 14px}
.att{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--ln)}
.att .t{flex:1;min-width:0}.att b{display:block;font-weight:600}.att small{color:var(--mu)}
.seg{display:flex;flex:none;border:1.5px solid var(--ln);border-radius:12px;overflow:hidden}
.seg button{min-height:44px;min-width:64px;border:0;background:var(--sf);font-weight:500;color:var(--mu)}
.seg button[aria-pressed=true].y{background:var(--ok);color:#fff}.seg button[aria-pressed=true].n{background:var(--er);color:#fff}
.tally{position:sticky;top:-20px;background:var(--sf);padding:6px 0 10px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;display:none;z-index:30;max-width:90%}
h1{letter-spacing:-.4px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="mk" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="36" cy="38" r="19"/><path d="M31 11h10M36 11v6M51 20l4-4M54 14l4 4M3 31h9M1 38h11M5 45h8"/></g><path d="M28 38l6 6 10-11" fill="none" stroke="#6A4DFF" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/></symbol></svg>
<header>
  <div class="lg" role="img" aria-label="Tempo" style="display:flex;align-items:center;gap:6px"><svg><use href="#mk"/></svg><span aria-hidden="true" style="font:600 22px Outfit,sans-serif">tempo</span></div>
  <button class="ctx" id="ctx" aria-label="Cambiar de contexto"><span class="av" style="width:30px;height:30px;font-size:13px;border-radius:8px">AD</span><span style="min-width:0"><b>Academia Dance</b><span class="r">Instructor</span></span></button>
  <button class="ib" id="tg" aria-label="Cambiar tema">◐</button>
</header>
<main id="main"></main>
<div class="tab" id="tab" role="navigation" aria-label="Secciones"></div>
<div class="sheet" id="sh" role="dialog" aria-modal="true"><div class="in" id="shin"></div></div>
<div class="toast" id="to" role="status"></div>

<script>
var $=function(s){return document.querySelector(s)};
var TABS=[["hoy","Hoy","▣"],["cla","Clases","♫"],["alu","Alumnos","☺"],["hor","Horario","▤"]];
var CL=[["Salsa Nivel 2","16:30","Salón B","Terminada","ok","14/16","Salsa · Nivel 2"],["Salsa Nivel 1","18:00","Salón A","Próxima","n","14/16","Salsa · Nivel 1"],["Bachata Intermedio","19:30","Salón A","Próxima","n","12/12 · 2 en espera","Bachata · Intermedio"]];
var GR=[["Salsa Nivel 1","Lun y mié 18:00","14 alumnos"],["Salsa Nivel 2","Mar y jue 16:30","14 alumnos"],["Bachata Intermedio","Lun y mié 19:30","12 alumnos"],["Ritmos Kids","Sáb 10:00","9 alumnos"]];
var AL=[["Valeria Soto","Salsa Nivel 1","ok","Activa",92,"Mejoró el giro doble. Practicar tiempos."],["Jorge Ibarra","Salsa Nivel 1","ok","Activa",85,""],["Camila Ruiz","Salsa Nivel 1","wa","Vence en 2 días",78,"Quiere pasar a Nivel 2."],["Héctor Mena","Salsa Nivel 1","er","Vencida",60,""],["Daniela Vega","Salsa Nivel 1","ok","Activa",96,"Candidata a la presentación de diciembre."],["Iván Cortés","Bachata Intermedio","ok","Activa",88,""]];
var HOR=[["Lunes",[["18:00","Salsa Nivel 1","Salón A"],["19:30","Bachata Intermedio","Salón A"]]],["Martes",[["16:30","Salsa Nivel 2","Salón B"]]],["Miércoles",[["18:00","Salsa Nivel 1","Salón A"],["19:30","Bachata Intermedio","Salón A"]]],["Jueves",[["16:30","Salsa Nivel 2","Salón B"]]],["Sábado",[["10:00","Ritmos Kids","Salón A"]]]];
var ATT={};var cur="hoy";
function pill(c,t){return '<span class="pill p-'+c+'">'+t+'</span>'}
function ini(n){return n.split(' ').slice(0,2).map(function(x){return x[0]}).join('')}
function row(av,t,s,r,k,i){return '<button class="row" data-k="'+k+'" data-i="'+i+'"><span class="av">'+av+'</span><span class="t"><b>'+t+'</b><small>'+s+'</small></span>'+r+'</button>'}
function head(t,s){return '<h1>'+t+'</h1><p class="sub">'+s+'</p>'}
function aluList(){var q=($('#q')||{value:""}).value.toLowerCase();var f=AL.filter(function(x){return x[0].toLowerCase().indexOf(q)>-1});return f.length?f.map(function(x){return row(ini(x[0]),x[0],x[1]+" · "+x[4]+"% asistencia",pill(x[2],x[2]==="ok"?"Activa":x[2]==="wa"?"Por vencer":"Vencida"),"alu",AL.indexOf(x))}).join(''):'<p class="sub">Sin resultados. Prueba con otro nombre.</p>'}
var V={
hoy:function(){return head("Hola, Mariana","Jueves 5 de noviembre")+
'<div class="next"><small>Siguiente clase · en 1 h 20 min</small><div class="t">Salsa Nivel 1</div><p>18:00 · Salón A · 14 de 16 lugares</p><button data-k="lista" data-i="1">Pasar lista</button></div>'+
'<div class="kpis"><div class="kpi"><small>Clases hoy</small><strong>3</strong></div><div class="kpi"><small>Alumnos hoy</small><strong>40</strong></div><div class="kpi"><small>Asistencia semanal</small><strong>87%</strong></div></div>'+
'<h2>Clases de hoy</h2><div class="list">'+CL.map(function(c,i){return row(c[1].replace(':','.').slice(0,2),c[0],c[1]+" · "+c[2]+" · "+c[5],pill(c[4],c[3]),"cl",i)}).join('')+'</div>'},
cla:function(){return head("Clases y grupos","Los grupos que tienes asignados")+'<div class="list">'+GR.map(function(g,i){return row(g[0].split(' ').map(function(w){return w[0]}).join('').slice(0,2),g[0],g[1]+" · "+g[2],'<span style="color:var(--mu);font-size:20px">›</span>',"gr",i)}).join('')+'</div>'},
alu:function(){return head("Alumnos","Solo los de tus grupos")+'<input class="search" id="q" type="search" placeholder="Buscar alumno" aria-label="Buscar alumno"><div class="list" id="al">'+aluList()+'</div><p class="sub" style="margin-top:12px">Ves si la membresía est\u00e1 al corriente. Los pagos los gestiona recepci\u00f3n.</p>'},
hor:function(){return head("Horario","Tus clases de la semana")+HOR.map(function(d){return '<div class="day">'+d[0]+'</div><div class="list">'+d[1].map(function(c){return '<div class="row"><span class="av">'+c[0].slice(0,2)+'</span><span class="t"><b>'+c[1]+'</b><small>'+c[0]+' · '+c[2]+'</small></span></div>'}).join('')+'</div>'}).join('')+'<button class="btn s" style="width:100%;margin-top:16px" data-toast="Solicitud enviada al gerente">Solicitar cambio de horario</button>'}
};
function render(){
 $('#tab').innerHTML=TABS.map(function(t){return '<button data-t="'+t[0]+'"'+(t[0]===cur?' aria-current="page"':'')+'><span aria-hidden="true">'+t[2]+'</span>'+t[1]+'</button>'}).join('');
 $('#main').innerHTML=V[cur]();
 var q=$('#q');if(q)q.addEventListener('input',function(){$('#al').innerHTML=aluList()});
}
function toast(t){var e=$('#to');e.textContent=t;e.style.display='block';setTimeout(function(){e.style.display='none'},2200)}
function open(h){$('#shin').innerHTML=h;$('#sh').classList.add('on')}
function close(){$('#sh').classList.remove('on')}
function kv(a,b){return '<div class="kv"><span>'+a+'</span><b>'+b+'</b></div>'}
var X='<button class="btn s" data-x>Cerrar</button>';
function tally(){var y=0,n=0;AL.slice(0,5).forEach(function(a,i){if(ATT[i]==='y')y++;if(ATT[i]==='n')n++});return y+' presentes · '+n+' faltas · '+(5-y-n)+' sin marcar'}
function lista(){var cl=CL[1];open('<h2>Pasar lista</h2><p class="sub">'+cl[0]+' · '+cl[1]+' · '+cl[2]+'</p><div class="tally" id="ty">'+tally()+'</div>'+
 AL.slice(0,5).map(function(a,i){return '<div class="att"><span class="av">'+ini(a[0])+'</span><span class="t"><b>'+a[0]+'</b><small>'+(a[2]==='er'?'Membresía vencida: avisa a recepción':a[2]==='wa'?'Vence en 2 días':'Activa')+'</small></span><div class="seg" role="group" aria-label="Asistencia de '+a[0]+'"><button class="y" data-a="'+i+'y" aria-pressed="'+(ATT[i]==='y')+'">Vino</button><button class="n" data-a="'+i+'n" aria-pressed="'+(ATT[i]==='n')+'">Faltó</button></div></div>'}).join('')+
 '<div class="acts"><button class="btn s" data-toast="Abriendo escáner de QR">Escanear QR de un alumno</button><button class="btn" data-toast="Asistencia guardada">Guardar asistencia</button>'+X+'</div>')}
document.addEventListener('click',function(e){
 var t=e.target.closest('[data-t]');if(t){cur=t.dataset.t;render();window.scrollTo(0,0);return}
 var at=e.target.closest('[data-a]');if(at){var v=at.dataset.a,i=v.slice(0,-1),s=v.slice(-1);ATT[i]=ATT[i]===s?null:s;lista();return}
 var m=e.target.closest('[data-toast]');if(m){close();toast(m.dataset.toast);return}
 if(e.target.id==='sh'||e.target.closest('[data-x]')){close();return}
 var r=e.target.closest('[data-k]');if(!r)return;var k=r.dataset.k,i=+r.dataset.i;
 if(k==="lista"){lista()}
 else if(k==="cl"){var c=CL[i];open('<h2>'+c[0]+'</h2><p class="sub">'+c[1]+' · '+c[2]+'</p>'+kv("Estado",pill(c[4],c[3]))+kv("Cupo",c[5])+kv("Grupo",c[6])+'<div class="acts">'+(c[3]==="Terminada"?'<button class="btn s" data-toast="Asistencia de la clase">Ver asistencia</button>':'<button class="btn" data-k="lista" data-i="1">Pasar lista</button>')+X+'</div>')}
 else if(k==="gr"){var g=GR[i];open('<h2>'+g[0]+'</h2><p class="sub">'+g[1]+'</p>'+kv("Alumnos",g[2])+kv("Nivel",g[0].indexOf("Nivel 2")>-1||g[0].indexOf("Inter")>-1?"Intermedio":"Principiante")+'<div class="acts"><button class="btn" data-t="alu" data-x>Ver alumnos</button><button class="btn s" data-toast="Aviso enviado a los alumnos del grupo">Avisar al grupo</button><button class="btn s" data-toast="Solicitud enviada al gerente">Solicitar cambio de horario</button>'+X+'</div>')}
 else if(k==="alu"){var a=AL[i];open('<h2>'+a[0]+'</h2><p class="sub">'+a[1]+'</p>'+kv("Membresía",pill(a[2],a[3]))+kv("Asistencia del mes",a[4]+"%")+'<div class="fld" style="margin-top:14px"><label for="nt">Seguimiento</label><textarea id="nt" rows="3" placeholder="Escribe una nota sobre su avance">'+a[5]+'</textarea></div><div class="fld"><label for="lv">Nivel</label><select id="lv"><option>Principiante</option><option>Intermedio</option><option>Avanzado</option></select></div><div class="acts"><button class="btn" data-toast="Nota guardada">Guardar seguimiento</button>'+X+'</div>')}
});
$('#ctx').addEventListener('click',function(){open('<h2>Cambiar de espacio</h2><p class="sub">Sin cerrar sesión.</p><div class="list">'+[["AD","Academia Dance","Instructor"],["GT","Gimnasio Titan","Propietario"],["CC","Centro de Cursos","Cliente"]].map(function(c){return '<button class="row" data-toast="Cambiando a '+c[1]+'…"><span class="av">'+c[0]+'</span><span class="t"><b>'+c[1]+'</b><small>'+c[2]+'</small></span></button>'}).join('')+'</div>')});
$('#tg').addEventListener('click',function(){var r=document.documentElement,d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'});
document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
(function(){var C=[["L","Libiter","Superadministrador","YBMqAebLzFoijBGDA35R35"],["GT","Gimnasio Titan","Propietario","P8ztf3F31bM814VKL42G1i"],["GT","Gimnasio Titan · Centro","Recepción","UCuK7tpyTy7ZKcCfrNuCMr"],["AD","Academia Dance","Instructor","NVa9SggYm1sFtTa3sb5BhL"],["GT","Gimnasio Titan","Cliente","HEpEpwWdHPfAGumFbtxVf7"]],N=3;
$('#ctx').addEventListener('click',function(){open('<h2>Cambiar de espacio</h2><p class="sub">Sin cerrar sesión. Cada espacio se abre en una pestaña nueva.</p><div class="list">'+C.map(function(c,i){var h='<span class="av">'+c[0]+'</span><span class="t"><b>'+c[1]+'</b><small>'+c[2]+(i===N?' · actual':'')+'</small></span>';return i===N?'<div class="row" style="border-color:var(--br)">'+h+'</div>':'<a class="row" style="text-decoration:none;color:inherit" href="https://claude.ai/artifact/'+c[3]+'" target="_blank" rel="noopener">'+h+'</a>'}).join('')+'</div>')});
var sh=document.getElementById('sh'),last=null,sel='button,a[href],input,select,textarea';new MutationObserver(function(){if(sh.classList.contains('on')){last=document.activeElement;var f=sh.querySelector(sel);if(f)f.focus()}else if(last){last.focus();last=null}}).observe(sh,{attributes:true,attributeFilter:['class']});
sh.addEventListener('keydown',function(e){if(e.key!=='Tab')return;var f=sh.querySelectorAll(sel);if(!f.length)return;var a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}})})();
render();
</script>
</body>
</html>
