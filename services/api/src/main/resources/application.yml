spring:
  application:
    name: tempo-api
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tempo}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${DB_USER:tempo}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: filesystem:../../database/migrations,classpath:db/migration
    validate-on-migrate: true
  jackson:
    time-zone: UTC
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

tempo:
  security:
    cognito-issuer: ${COGNITO_ISSUER_URI:}

logging:
  level:
    root: INFO
    com.koaliado.tempo: INFO
